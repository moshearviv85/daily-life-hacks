name: CI

# CP3.1: fail closed on PRs before merge to main/staging.
on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-checked:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Reject mass dateModified edits
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          DATEMODIFIED_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: node scripts/check-datemodified-churn.mjs

      - name: Warn on unsourced gram or percent claims
        run: node scripts/warn-unsourced-quantities.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and verify routing
        run: npm run build:checked

      - name: Canonical routing unit tests
        run: node --test tests/canonical-routing.test.mjs tests/index-prune-policy.test.mjs tests/article-technical-seo-schema.test.mjs tests/flagship-inbound-crawl.test.mjs tests/flagship-engagement.test.mjs tests/article-content-ux.test.mjs tests/keep-protein-csv-drift.test.mjs tests/stale-pinto-fiber-snapshot.test.mjs tests/gauntlet-internal-page.test.mjs

      - name: Pipeline workflow contract tests
        run: |
          pip install pytest
          python -m pytest tests/pipeline_article_gate_test.py -q

      - name: Traffic measurement and calculator regression tests
        run: |
          node --test tests/analytics-page-views.test.mjs tests/traffic-recovery.test.mjs tests/conversion-funnel.test.mjs
          python -m pytest tests/cli/test_weekly_scorecard.py tests/cli/test_traffic_sql.py -q
