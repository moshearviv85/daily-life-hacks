name: Purge Spam Pins

# Manual only. Deletes pins whose destination is NOT our own domain.
# Legacy affiliate pins (including ~49 cloaked-redirect trackers) are an active
# spam violation sitting on the same account as our content.
#
# Runs a DRY RUN unless you type DELETE into the confirm box. The dry run
# uploads pinterest-purge-report.json so you can read the full list first.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to actually remove the pins. Anything else = dry run.'
        required: false
        default: ''
      keep_hosts:
        description: 'Extra comma-separated hosts to KEEP (optional)'
        required: false
        default: ''

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Purge spam pins
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PURGE_CONFIRM: ${{ github.event.inputs.confirm }}
          KEEP_HOSTS: ${{ github.event.inputs.keep_hosts }}
        run: python scripts/purge-spam-pins.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-purge-report
          path: pinterest-purge-report.json
          if-no-files-found: warn
