name: Monthly Grocery Price Watch

# Manual BLS refresh for the existing per-dollar datasets.
# Scheduled publishing is frozen (SEO PR-5). A dispatch updates numbers inside
# the existing CSV files and does not create article files. The monthly report
# file is written only when the create_files input is true.

on:
  # Scheduled Price Watch PRs are frozen until the site recovers (SEO PR-5).
  # schedule:
  #   - cron: '0 9 20 * *'   # 09:00 UTC on the 20th of every month
  workflow_dispatch:
    inputs:
      create_files:
        description: 'Write the monthly report file. Off by default. Never creates article files.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  price-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update numbers in existing datasets
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}   # optional — script works without it
          CREATE_FILES: ${{ inputs.create_files }}
        run: |
          ARGS=()
          if [ "$CREATE_FILES" = "true" ]; then
            ARGS+=(--create-files)
          fi
          python scripts/update-price-index.py "${ARGS[@]}"
          if [ -n "$(git status --porcelain -- src/data/articles)" ]; then
            echo "update-price-index modified article files. That is not allowed." >&2
            git status --porcelain -- src/data/articles >&2
            exit 1
          fi

      - name: Detect dataset changes
        id: diff
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain -- public/data/fiber-per-dollar-2026.csv public/data/protein-per-dollar-2026.csv pipeline-data/index-update-report-*.md)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No number changes in existing datasets."
          fi

      - name: Commit number updates and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          CREATE_FILES: ${{ inputs.create_files }}
        run: |
          MONTH="${{ steps.diff.outputs.month }}"
          BRANCH="price-watch-$MONTH"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -- public/data/fiber-per-dollar-2026.csv public/data/protein-per-dollar-2026.csv
          if [ "$CREATE_FILES" = "true" ]; then
            git add -- pipeline-data/index-update-report-*.md
          fi
          if git diff --cached --name-only | grep -E '^src/data/articles/'; then
            echo "Refusing to commit new or modified article files." >&2
            exit 1
          fi
          git commit -m "chore(data): refresh existing price-index numbers $MONTH"
          git push -f origin "$BRANCH"

          {
            echo "Monthly grocery Price Watch from official U.S. government (BLS) price data."
            echo ""
            echo "This updates numbers inside the existing per-dollar datasets. It does not create article files."
            echo ""
            git diff --cached --stat HEAD~1 || true
          } > /tmp/pr-body.md

          gh pr create --base main --head "$BRANCH" \
            --title "Grocery Price Watch — $MONTH" \
            --body-file /tmp/pr-body.md \
          || gh pr edit "$BRANCH" --body-file /tmp/pr-body.md
