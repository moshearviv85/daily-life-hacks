# Submit newly published / updated canonical URLs to IndexNow (Bing, Yandex,
# Naver, Seznam, Yep — Google does not participate).
#
# WHY THIS IS THE ONLY INDEXNOW SUBMISSION WORKFLOW
#
# A Git-range diff inside the deploy job is correct for an ordinary successful
# push, but it loses URLs in three situations this repo actually hits:
#
#   1. Scheduled rebuilds. An article with a future `publishAt` enters the
#      sitemap on a later daily rebuild with no commit behind it. A Git diff
#      finds nothing, so scheduled articles are never submitted at all.
#   2. Failed deploys. The IndexNow step runs after "Build and verify routing";
#      when the build fails the step never runs, and the *next* push diffs from
#      a base after those commits — so their URLs are lost permanently. This is
#      exactly what happened to the 9 comparison articles on 2026-07-26.
#   3. Force-pushes / merges, where `github.event.before` is not a useful base.
#
# This workflow is state-based rather than event-based: it compares the built
# pages against a cached snapshot of the last site that was successfully
# submitted. A URL is submitted when it is new, its main-content sha256 changed,
# or its sitemap lastmod moved forward. A dateModified that only moved backward
# is not a change; the content hash is the source of truth. Removed (410 /
# noindex) URLs and new 301 sources are submitted too. lastmod is day-granular,
# so same-day body edits are caught by the content hash. Keep Reading, build
# hashes, nonces, and publish dates are not part of that hash.
#
# At most 60 URLs go out per run. The rest stay in .indexnow/queue.json in the
# same cache and drain on the next successful run, or via workflow_dispatch
# input drain_queue_only. The snapshot and the queue advance together only
# after submission succeeds, so a failed run retries instead of dropping URLs.
# A cold start (no snapshot) still submits nothing.
#
# It triggers on `workflow_run` after Deploy Cloudflare Pages *succeeds*, so it
# covers push, scheduled and manual deploys alike, and it can never submit a
# URL that is not actually live.
#
# deploy-cloudflare-pages.yml deliberately does not submit to IndexNow. Keeping
# submission here prevents duplicate requests for the same successful main
# deploy while preserving state-based retries and report artifacts.

name: IndexNow (sitemap diff)

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only, make no IndexNow request"
        type: boolean
        default: true
      drain_queue_only:
        description: "Submit the persisted queue only; do not detect new changes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never let two runs race on the snapshot cache.
  group: indexnow-sitemap-diff
  cancel-in-progress: false

jobs:
  submit:
    # Only after a *successful* production deploy. A failed deploy leaves the
    # snapshot untouched, so the next successful one picks up everything that
    # accumulated in the meantime.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the commit that was deployed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Rebuilding reproduces the exact sitemap that was just deployed,
      # including the publishAt release gate evaluated at build time.
      - name: Build
        run: npm run build

      - name: Restore previous sitemap snapshot
        uses: actions/cache/restore@v4
        with:
          path: .indexnow
          key: indexnow-sitemap-${{ github.run_id }}
          restore-keys: |
            indexnow-sitemap-

      - name: Diff built pages against the last submitted snapshot
        id: diff
        env:
          DRAIN: ${{ inputs.drain_queue_only && '--drain-queue-only' || '' }}
        run: |
          python scripts/indexnow-sitemap-diff.py \
            --sitemap-dir dist \
            --snapshot .indexnow/sitemap-snapshot.json \
            --queue .indexnow/queue.json \
            --baseline scripts/indexnow-content-baseline.json \
            --output .indexnow/changed-urls.txt \
            --reasons .indexnow/changed-urls.json \
            --log-file indexnow-diff-report.json \
            $DRAIN
          COUNT=$(wc -l < .indexnow/changed-urls.txt | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Candidate URLs: $COUNT"

      # notify-indexnow.py stays the single audited submission path. Sitemap
      # URLs must be in this build's sitemap. Redirect sources must match
      # dist/_redirects. Removed URLs must be missing or noindex. A URL the
      # diff handed over and the checker drops fails the run.
      - name: Submit to IndexNow
        if: steps.diff.outputs.count != '0'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          mapfile -t URLS < .indexnow/changed-urls.txt
          python scripts/notify-indexnow.py \
            $DRY_RUN \
            --sitemap-dir dist \
            --reasons-file .indexnow/changed-urls.json \
            --log-file indexnow-submission-report.json \
            --urls "${URLS[@]}"

      # Snapshot and queue advance together, and only after submission
      # succeeded. A partial batch (more than 60 changes) leaves the remainder
      # in the queue instead of aborting. A failed submission retries next run.
      - name: Advance the snapshot and queue
        if: success() && !inputs.dry_run
        env:
          DRAIN: ${{ inputs.drain_queue_only && '--drain-queue-only' || '' }}
        run: |
          python scripts/indexnow-sitemap-diff.py \
            --sitemap-dir dist \
            --snapshot .indexnow/sitemap-snapshot.json \
            --queue .indexnow/queue.json \
            --baseline scripts/indexnow-content-baseline.json \
            --write-snapshot \
            $DRAIN

      - name: Save sitemap snapshot
        if: success() && !inputs.dry_run
        uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-sitemap-${{ github.run_id }}

      - name: Upload IndexNow reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-sitemap-diff-${{ github.run_id }}
          path: |
            indexnow-diff-report.json
            indexnow-submission-report.json
          if-no-files-found: warn
          retention-days: 30
