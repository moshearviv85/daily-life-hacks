name: BLS Nutrition per Dollar Monthly Refresh

# Rebuilds the BLS nutrition-per-dollar time series from the federal Average
# Price survey, for the U.S. city average plus the four census regions, over
# the last 10 years. This is the dataset that refreshes itself: the whole point
# of it is that the numbers are never a stale snapshot.
#
# The BLS public API v2 works WITHOUT a key. Do not add one as a secret unless
# somebody registers for it; the keyless limits (25 series and 10 years per
# request) are already respected inside the script.
#
# BLS publishes the previous month's Average Price data around mid-month, so
# this runs on the 21st, a day after the existing Price Watch job, to avoid two
# jobs hammering the same API in the same hour.
#
# When the two CSVs change, this job also regenerates and commits the matching
# registration files: datapackage hashes (public + standalone), the API index,
# and the dist-datasets CSV mirror. Committing the CSVs alone left those
# descriptors stale after the 2026-08-21 refresh (commit 6f88319). Then
# `node scripts/verify-data-foundation.mjs` failed, Cloudflare Pages
# `npm run build:checked` failed Saturday and Sunday, and IndexNow (Bing)
# skipped two days. An unreviewed hash update of files this job just wrote is
# better than a broken production deploy. Push to main is intentional.

on:
  schedule:
    - cron: '0 10 21 * *'   # 10:00 UTC on the 21st of every month
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

concurrency:
  group: bls-monthly-refresh
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No pip install: the timeseries script is standard library only, on
      # purpose, so this job cannot break on a dependency it does not need.

      - name: Rebuild the BLS time series
        run: python scripts/build_bls_timeseries.py --years 10

      - name: Detect CSV changes
        id: csv
        run: |
          set -euo pipefail
          MONTHLY="public/data/bls-nutrition-per-dollar-monthly.csv"
          LATEST="public/data/bls-nutrition-per-dollar-latest.csv"
          if git diff --quiet -- "$MONTHLY" "$LATEST"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in the BLS CSVs. BLS has not published a new month yet, or the revisions were identical. Nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "BLS CSVs changed. Registration files will be regenerated and committed with them."
          fi

      # build-api-index.mjs imports esbuild (via Astro) to load datasets.ts.
      - name: Set up Node
        if: steps.csv.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        if: steps.csv.outputs.changed == 'true'
        run: npm ci

      - name: Mirror CSVs and regenerate registration files
        if: steps.csv.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cp -- public/data/bls-nutrition-per-dollar-monthly.csv dist-datasets/data/
          cp -- public/data/bls-nutrition-per-dollar-latest.csv dist-datasets/data/
          python scripts/build_datapackage.py
          node scripts/build-api-index.mjs
          node scripts/verify-data-foundation.mjs

      - name: Commit CSVs and matching registration files
        if: steps.csv.outputs.changed == 'true'
        run: |
          set -euo pipefail

          MONTHLY="public/data/bls-nutrition-per-dollar-monthly.csv"
          LATEST="public/data/bls-nutrition-per-dollar-latest.csv"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            "$MONTHLY" \
            "$LATEST" \
            dist-datasets/data/bls-nutrition-per-dollar-monthly.csv \
            dist-datasets/data/bls-nutrition-per-dollar-latest.csv \
            public/data/datapackage.json \
            dist-datasets/datapackage.json \
            public/data/api-index-v1.json

          if git diff --cached --quiet; then
            echo "Registration rebuild produced no file changes after the CSV update. Nothing to commit."
            exit 0
          fi

          LATEST_MONTH="$(python -c "
          import csv
          with open('public/data/bls-nutrition-per-dollar-latest.csv', encoding='utf-8', newline='') as fh:
              dates = [row['date'][:7] for row in csv.DictReader(fh)]
          print(max(dates) if dates else 'unknown')
          ")"

          git commit -m "chore(data): refresh BLS nutrition-per-dollar series through ${LATEST_MONTH}"
          git push origin HEAD:main

          echo "Committed. Latest BLS month in the dataset: ${LATEST_MONTH}"
          echo "Registration files (datapackage, API index, dist-datasets mirror) were regenerated with the CSVs."
