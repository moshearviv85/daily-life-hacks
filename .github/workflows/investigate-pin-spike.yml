name: Investigate Pin Spike

# Manual, read-only. Pulls per-pin analytics to find out what drove the
# Jul 15-16 2026 impression spike and which pins/boards actually earn.
on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Investigate
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/investigate-pin-spike.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pin-spike-report
          path: pin-spike-report.json
          if-no-files-found: warn
