name: Pinterest Purge Verdict

# Manual, read-only. Measures whether the 2026-07-26 spam purge restored
# distribution: account-level daily impressions plus a post-purge pin cohort
# against the pre-purge July cohort. Posts nothing, deletes nothing.
on:
  workflow_dispatch:

jobs:
  verdict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Measure
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/pinterest-purge-verdict.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purge-verdict-report
          path: purge-verdict-report.json
          if-no-files-found: warn
