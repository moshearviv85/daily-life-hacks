name: Create Boards

# Manual. Creates Pinterest boards from pipeline-data/pinterest-boards-spec.json.
# Board specificity is the strongest distribution lever measured on this account:
# narrow keyword-true boards return ~10x the impressions per pin of broad ones.
# Dry run unless you type CREATE. Existing board names are skipped, never duplicated.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CREATE to actually create the boards. Anything else = dry run.'
        required: false
        default: ''

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CREATE_CONFIRM: ${{ github.event.inputs.confirm }}
        run: python scripts/create-boards.py
