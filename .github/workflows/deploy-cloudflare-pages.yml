# Build + deploy to Cloudflare Pages via Wrangler Direct Upload (bypasses fragile Git
# integration UI). Every run re-asserts the Pages Git source is unlinked so the
# Cloudflare GitHub App cannot post false-red "Cloudflare Pages" checks on healthy
# Direct Upload deploys. See docs/cloudflare-deploy-source-of-truth.md.
# Required GitHub repo secret: CLOUDFLARE_API_TOKEN (Permissions: Cloudflare Pages — Edit)
#
# Daily run: rebuilds from origin/main. At build time, publishAt / isReleased() and sitemap
# filtering apply — scheduled articles become indexable without a new commit (content must
# already be on main).

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main, staging]
  schedule:
    # Daily ~06:15 UTC (morning IL / early US). Adjust if you want midnight in a specific TZ.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Branch-scoped so a staging push cannot cancel an in-flight production deploy (or vice versa).
  group: cloudflare-pages-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read Pages project configuration
        id: pages_config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 91c501fca325c556efd161e4f904d443
        run: |
          PROJECT_JSON=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/daily-life-hacks")
          printf '%s' "$PROJECT_JSON" > "$RUNNER_TEMP/pages-project.json"
          PRODUCTION_BRANCH=$(python -c "import json,sys; d=json.load(sys.stdin); assert d.get('success') is True, d; print(d['result']['production_branch'])" <<< "$PROJECT_JSON")
          test -n "$PRODUCTION_BRANCH"
          echo "production_branch=$PRODUCTION_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages production branch: $PRODUCTION_BRANCH"

      - name: Unlink Cloudflare Pages Git source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 91c501fca325c556efd161e4f904d443
        run: |
          python <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          project_name = "daily-life-hacks"
          project_path = os.path.join(os.environ["RUNNER_TEMP"], "pages-project.json")
          with open(project_path, encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload.get("success") is True, payload

          def log(message):
              print(message, flush=True)

          def git_source(project):
              result = (project or {}).get("result") or {}
              src = result.get("source")
              if not isinstance(src, dict):
                  return None
              config = src.get("config") or {}
              if src.get("type") or config.get("repo_name") or config.get("owner"):
                  return src
              return None

          def request_json(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      raw = response.read()
                      code = response.status
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  code = error.code
              text = raw.decode("utf-8", errors="replace")
              if not text.strip():
                  parsed = {"success": code < 400, "result": None}
              else:
                  try:
                      parsed = json.loads(text)
                  except json.JSONDecodeError:
                      parsed = {
                          "success": False,
                          "errors": [{"message": text[:2000]}],
                      }
              return code, parsed, text[:2000]

          project_url = (
              f"https://api.cloudflare.com/client/v4/accounts/{account_id}"
              f"/pages/projects/{project_name}"
          )
          # Unlink subresource only. Never DELETE project_url itself.
          source_url = f"{project_url}/source"

          current = git_source(payload)
          if current is None:
              log("Cloudflare Pages Git source already absent; skipping unlink.")
              sys.exit(0)

          config = dict(current.get("config") or {})
          log(
              "Cloudflare Pages Git source: "
              f"type={current.get('type')} owner={config.get('owner')} "
              f"repo={config.get('repo_name')} "
              f"production_branch={config.get('production_branch')} "
              f"deployments_enabled={config.get('deployments_enabled')} "
              f"production_deployments_enabled={config.get('production_deployments_enabled')} "
              f"preview_deployment_setting={config.get('preview_deployment_setting')}"
          )

          # Clearing source (not just auto-deploy flags) is required: a linked
          # GitHub repo still lets the Cloudflare GitHub App post false-red
          # "Cloudflare Pages" checks. PATCH null follows this same endpoint's
          # documented delete convention (env vars: set the key to null).
          log("Unlinking Cloudflare Pages Git source via PATCH source=null.")
          patch_code, patched, patch_text = request_json(
              "PATCH", project_url, {"source": None}
          )
          # Confirm from GET: PATCH bodies may omit source even when it remains.
          get_code, refreshed, get_text = request_json("GET", project_url)
          if (
              patched.get("success") is True
              and refreshed.get("success") is True
              and git_source(refreshed) is None
          ):
              log("Unlinked Cloudflare Pages Git source (PATCH source=null).")
              sys.exit(0)

          log(
              f"PATCH source=null did not clear Git source "
              f"(HTTP {patch_code}, success={patched.get('success')}); "
              "trying DELETE /pages/projects/.../source."
          )
          delete_code, deleted, delete_text = request_json("DELETE", source_url)
          get_code, refreshed, get_text = request_json("GET", project_url)
          if (
              deleted.get("success") is True
              and refreshed.get("success") is True
              and git_source(refreshed) is None
          ):
              log("Unlinked Cloudflare Pages Git source via DELETE /source.")
              sys.exit(0)

          raise SystemExit(
              "Failed to unlink Cloudflare Pages Git source. "
              "Direct Upload is unchanged, but a linked Git source still false-reds. "
              f"PATCH HTTP {patch_code}: {patch_text} "
              f"DELETE HTTP {delete_code}: {delete_text} "
              f"GET HTTP {get_code}: {get_text}"
          )
          PY

      - name: Build and verify routing
        run: npm run build:checked

      - name: Build Pages Functions
        run: |
          rm -rf worker-out dist/_worker.js
          npx wrangler pages functions build functions --outdir=worker-out --output-routes-path=dist/_routes.json --project-directory=. --build-output-directory=dist
          cp worker-out/index.js dist/_worker.js
          cp public/_routes.json dist/_routes.json
          python -c "import json; routes=json.load(open('dist/_routes.json')); assert '/deploy-proof*' in routes['exclude'], routes"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 91c501fca325c556efd161e4f904d443
          wranglerVersion: "3.114.17"
          command: pages deploy dist --project-name=daily-life-hacks --branch=${{ github.ref_name == 'main' && steps.pages_config.outputs.production_branch || github.ref_name }}

      - name: Verify production custom domain
        if: github.ref_name == 'main'
        run: |
          for i in $(seq 1 40); do
            LIVE_SHA=$(curl -fsS "https://www.daily-life-hacks.com/deploy-proof/?expected=${GITHUB_SHA}" \
              | python -c "import re,sys; match=re.search(r'data-commit=\"([^\"]+)\"', sys.stdin.read()); print(match.group(1) if match else '')" 2>/dev/null || true)
            echo "[$i] live=$LIVE_SHA expected=$GITHUB_SHA"
            if [ "$LIVE_SHA" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Production custom domain did not reach commit $GITHUB_SHA"
          exit 1
