# Build + deploy to Cloudflare Pages via Wrangler Direct Upload (bypasses fragile Git
# integration UI). Every run re-asserts Pages Git auto-deploy is disabled so the
# Cloudflare GitHub App cannot post false-red "Cloudflare Pages" checks on healthy
# Direct Upload deploys. See docs/cloudflare-deploy-source-of-truth.md.
# Required GitHub repo secret: CLOUDFLARE_API_TOKEN (Permissions: Cloudflare Pages — Edit)
#
# Daily run: rebuilds from origin/main. At build time, publishAt / isReleased() and sitemap
# filtering apply — scheduled articles become indexable without a new commit (content must
# already be on main).

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main, staging]
  schedule:
    # Daily ~06:15 UTC (morning IL / early US). Adjust if you want midnight in a specific TZ.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Branch-scoped so a staging push cannot cancel an in-flight production deploy (or vice versa).
  group: cloudflare-pages-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read Pages project configuration
        id: pages_config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 91c501fca325c556efd161e4f904d443
        run: |
          PROJECT_JSON=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/daily-life-hacks")
          printf '%s' "$PROJECT_JSON" > "$RUNNER_TEMP/pages-project.json"
          PRODUCTION_BRANCH=$(python -c "import json,sys; d=json.load(sys.stdin); assert d.get('success') is True, d; print(d['result']['production_branch'])" <<< "$PROJECT_JSON")
          test -n "$PRODUCTION_BRANCH"
          echo "production_branch=$PRODUCTION_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages production branch: $PRODUCTION_BRANCH"

      - name: Disable Cloudflare Pages Git auto-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 91c501fca325c556efd161e4f904d443
        run: |
          python <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          project_path = os.path.join(os.environ["RUNNER_TEMP"], "pages-project.json")
          with open(project_path, encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload.get("success") is True, payload

          result = payload.get("result") or {}
          source = result.get("source") or {}
          source_type = source.get("type")
          config = dict(source.get("config") or {})
          deployments_enabled = config.get("deployments_enabled")
          production_deployments_enabled = config.get("production_deployments_enabled")
          preview_deployment_setting = config.get("preview_deployment_setting")

          def log(message):
              print(message, flush=True)

          if not source_type:
              log("Cloudflare Pages Git auto-deploy already absent (no Git source); skipping PATCH.")
              sys.exit(0)

          owner = config.get("owner")
          repo_name = config.get("repo_name")
          production_branch = config.get("production_branch") or result.get("production_branch")
          log(
              "Cloudflare Pages Git source: "
              f"type={source_type} owner={owner} repo={repo_name} "
              f"production_branch={production_branch} "
              f"deployments_enabled={deployments_enabled} "
              f"production_deployments_enabled={production_deployments_enabled} "
              f"preview_deployment_setting={preview_deployment_setting}"
          )
          if not owner or not repo_name or not production_branch:
              raise SystemExit(
                  "Refusing to PATCH Pages source: type/owner/repo/production_branch "
                  "missing from GET response."
              )

          already_disabled = (
              deployments_enabled is False
              and production_deployments_enabled is False
              and preview_deployment_setting == "none"
          )
          if already_disabled:
              log("Cloudflare Pages Git auto-deploy already disabled; skipping PATCH.")
              sys.exit(0)

          # Keep the linked GitHub repo; only disable automatic Git deployments.
          # Prefer granular flags; also set deprecated deployments_enabled for compatibility.
          config["owner"] = owner
          config["repo_name"] = repo_name
          config["production_branch"] = production_branch
          config["production_deployments_enabled"] = False
          config["preview_deployment_setting"] = "none"
          config["deployments_enabled"] = False
          body = json.dumps({"source": {"type": source_type, "config": config}}).encode()
          url = (
              f"https://api.cloudflare.com/client/v4/accounts/{account_id}"
              "/pages/projects/daily-life-hacks"
          )
          request = urllib.request.Request(
              url,
              data=body,
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          log(
              "Disabling Cloudflare Pages Git auto-deploy "
              "(production_deployments_enabled=false, "
              "preview_deployment_setting=none, "
              "deployments_enabled=false)."
          )
          try:
              with urllib.request.urlopen(request) as response:
                  raw = response.read()
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", errors="replace")[:2000]
              raise SystemExit(f"Pages project PATCH failed HTTP {error.code}: {detail}") from error

          patched = json.loads(raw)
          assert patched.get("success") is True, patched
          patched_config = ((patched.get("result") or {}).get("source") or {}).get("config") or {}
          patched_deployments = patched_config.get("deployments_enabled")
          patched_production = patched_config.get("production_deployments_enabled")
          patched_preview = patched_config.get("preview_deployment_setting")
          log(
              "Disabled Cloudflare Pages Git auto-deploy "
              f"(production_deployments_enabled={patched_production}, "
              f"preview_deployment_setting={patched_preview}, "
              f"deployments_enabled={patched_deployments})."
          )
          if patched_production is not False or patched_preview != "none":
              raise SystemExit(
                  "PATCH succeeded but Git auto-deploy is still enabled: "
                  f"{patched_config}"
              )
          PY

      - name: Build and verify routing
        run: npm run build:checked

      - name: Build Pages Functions
        run: |
          rm -rf worker-out dist/_worker.js
          npx wrangler pages functions build functions --outdir=worker-out --output-routes-path=dist/_routes.json --project-directory=. --build-output-directory=dist
          cp worker-out/index.js dist/_worker.js
          cp public/_routes.json dist/_routes.json
          python -c "import json; routes=json.load(open('dist/_routes.json')); assert '/deploy-proof*' in routes['exclude'], routes"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 91c501fca325c556efd161e4f904d443
          wranglerVersion: "3.114.17"
          command: pages deploy dist --project-name=daily-life-hacks --branch=${{ github.ref_name == 'main' && steps.pages_config.outputs.production_branch || github.ref_name }}

      - name: Verify production custom domain
        if: github.ref_name == 'main'
        run: |
          for i in $(seq 1 40); do
            LIVE_SHA=$(curl -fsS "https://www.daily-life-hacks.com/deploy-proof/?expected=${GITHUB_SHA}" \
              | python -c "import re,sys; match=re.search(r'data-commit=\"([^\"]+)\"', sys.stdin.read()); print(match.group(1) if match else '')" 2>/dev/null || true)
            echo "[$i] live=$LIVE_SHA expected=$GITHUB_SHA"
            if [ "$LIVE_SHA" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Production custom domain did not reach commit $GITHUB_SHA"
          exit 1
